<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retired.Bet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050507;
            color: #f5f5f7;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -10;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 15, 15, 0.075),
                    transparent 32%
                ),
                #050507;
        }

        .glow {
            position: absolute;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 45%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(255, 20, 20, 0.12) 0%,
                rgba(255, 20, 20, 0.045) 35%,
                transparent 70%
            );

            filter: blur(20px);

            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.65;
                transform: translate(-50%, -50%) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        .top-glow {
            position: absolute;

            width: 550px;
            height: 250px;

            left: 50%;
            top: -170px;

            transform: translateX(-50%);

            background: radial-gradient(
                ellipse,
                rgba(255, 20, 20, 0.13),
                transparent 70%
            );

            filter: blur(25px);

            animation: topGlow 5s ease-in-out infinite;
        }

        @keyframes topGlow {
            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================================
           MOVING GRID
        ========================================= */

        .grid {
            position: absolute;

            width: 180%;
            height: 100%;

            left: -40%;
            top: 0;

            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            transform:
                perspective(500px)
                rotateX(62deg)
                scale(1.5);

            transform-origin: center bottom;

            animation: gridMove 12s linear infinite;
        }

        @keyframes gridMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 140px;
            }
        }

        /* =========================================
           PARTICLES
        ========================================= */

        .particles {
            position: absolute;
            inset: 0;
        }

        .particle {
            position: absolute;

            width: 2px;
            height: 2px;

            background: #ff1515;

            border-radius: 50%;

            opacity: 0;

            box-shadow:
                0 0 7px rgba(255, 21, 21, 0.8);

            animation:
                particleFloat var(--duration) linear infinite,
                particleFade var(--fade) ease-in-out infinite;
        }

        @keyframes particleFloat {
            from {
                transform:
                    translateY(110vh)
                    translateX(0);
            }

            to {
                transform:
                    translateY(-10vh)
                    translateX(var(--drift));
            }
        }

        @keyframes particleFade {
            0%, 100% {
                opacity: 0;
            }

            30%, 70% {
                opacity: var(--opacity);
            }
        }

        /* =========================================
           SIDE LIGHTS
        ========================================= */

        .side-light {
            position: absolute;

            width: 300px;
            height: 600px;

            top: 20%;

            filter: blur(90px);

            opacity: 0.12;
        }

        .side-light.left {
            left: -250px;

            background: #ff1515;

            animation:
                sideLeft 8s ease-in-out infinite;
        }

        .side-light.right {
            right: -250px;

            background: #ff1515;

            animation:
                sideRight 9s ease-in-out infinite;
        }

        @keyframes sideLeft {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(100px);
            }
        }

        @keyframes sideRight {
            0%, 100% {
                transform: translateY(100px);
            }

            50% {
                transform: translateY(0);
            }
        }

        /* =========================================
           VIGNETTE
        ========================================= */

        .vignette {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle,
                    transparent 35%,
                    rgba(0,0,0,0.25) 65%,
                    rgba(0,0,0,0.8) 100%
                );
        }

        /* =========================================
           NAVBAR
        ========================================= */

        nav {
            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom:
                1px solid rgba(255,255,255,0.06);

            background:
                rgba(5,5,7,0.72);

            backdrop-filter: blur(16px);

            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;

            letter-spacing: -0.7px;

            color: #ffffff;

            text-decoration: none;
        }

        .logo span {
            color: #ff1515;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
        }

        .nav-links a {
            color: #8f8f98;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .dashboard-btn {
            border:
                1px solid rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.035);

            color: #ffffff !important;

            padding: 10px 17px;

            border-radius: 7px;

            cursor: pointer;
        }

        .dashboard-btn:hover {
            border-color: #ff1515;

            background:
                rgba(255,21,21,0.08);

            box-shadow:
                0 0 20px rgba(255,21,21,0.08);
        }

        /* =========================================
           HERO
        ========================================= */

        .hero {
            min-height: 620px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding:
                100px 20px 90px;

            position: relative;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 80px;
            height: 1px;

            top: 24%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff1515,
                    transparent
                );

            opacity: 0.6;
        }

        .hero h1 {
            font-size:
                clamp(52px, 9vw, 105px);

            line-height: 0.95;

            font-weight: 900;

            letter-spacing: -5px;

            color: #ffffff;

            margin-bottom: 22px;

            text-shadow:
                0 0 40px rgba(255,255,255,0.035);

            animation:
                titleIn 1s ease-out;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero h1 span {
            color: #ff1515;

            text-shadow:
                0 0 35px rgba(255,21,21,0.28);
        }

        .hero-subtitle {
            color: #85858d;

            font-size: 18px;

            letter-spacing: 0.2px;

            margin-bottom: 34px;

            animation:
                subtitleIn 1s ease-out 0.15s both;
        }

        @keyframes subtitleIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .red-text {
            color: #ff1515;

            font-weight: 700;

            text-shadow:
                0 0 18px rgba(255,21,21,0.25);
        }

        /* =========================================
           DISCORD BUTTON
        ========================================= */

        .discord-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 190px;
            height: 50px;

            padding: 0 25px;

            background: #ff1515;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 10px 35px rgba(255,21,21,0.16);

            transition: 0.25s ease;

            animation:
                buttonIn 1s ease-out 0.3s both;
        }

        @keyframes buttonIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .discord-btn:hover {
            background: #ff3030;

            transform: translateY(-3px);

            box-shadow:
                0 14px 45px rgba(255,21,21,0.28);
        }

        /* =========================================
           VIDEO SECTION
        ========================================= */

        .video-section {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                20px 20px 110px;

            position: relative;
        }

        .video-container {
            width: min(900px, 90vw);

            aspect-ratio: 16 / 9;

            border:
                1px solid rgba(255,21,21,0.18);

            border-radius: 12px;

            overflow: hidden;

            background: #08080a;

            box-shadow:
                0 0 40px rgba(255,21,21,0.08),
                0 25px 80px rgba(0,0,0,0.45);

            transition: 0.3s ease;

            position: relative;
        }

        .video-container::before {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 2;

            border-radius: 12px;

            box-shadow:
                inset 0 0 40px rgba(255,21,21,0.04);
        }

        .video-container:hover {
            border-color:
                rgba(255,21,21,0.4);

            box-shadow:
                0 0 55px rgba(255,21,21,0.13),
                0 25px 90px rgba(0,0,0,0.55);

            transform:
                translateY(-3px);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;

            display: block;

            border: none;
        }

        /* =========================================
           MODAL
        ========================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.76);

            backdrop-filter: blur(8px);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 100;

            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 410px;

            background: #101012;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 30px 90px rgba(0,0,0,0.65),
                0 0 60px rgba(255,21,21,0.05);

            animation:
                modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;

                transform:
                    translateY(10px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .modal-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 26px;
        }

        .modal-header h2 {
            font-size: 22px;

            font-weight: 800;
        }

        .close-btn {
            width: 32px;
            height: 32px;

            border: none;

            border-radius: 6px;

            background:
                rgba(255,255,255,0.05);

            color: #888890;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;

            background:
                rgba(255,255,255,0.09);
        }

        /* =========================================
           FORM
        ========================================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            color: #8c8c94;

            font-size: 12px;

            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;

            height: 46px;

            background: #0a0a0c;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 7px;

            padding: 0 13px;

            padding-right: 45px;

            color: #ffffff;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .form-input:focus {
            border-color:
                rgba(255,21,21,0.65);

            box-shadow:
                0 0 0 3px
                rgba(255,21,21,0.07);
        }

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            background: none;

            border: none;

            color: #66666f;

            cursor: pointer;

            font-size: 12px;
        }

        .password-toggle:hover {
            color: #ffffff;
        }

        .login-btn {
            width: 100%;

            height: 46px;

            margin-top: 7px;

            background: #ff1515;

            border: none;

            border-radius: 7px;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #ff3030;
        }

        .register-btn {
            width: 100%;

            height: 44px;

            margin-top: 10px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 7px;

            color: #c5c5cb;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-btn:hover {
            background:
                rgba(255,255,255,0.06);

            color: #ffffff;
        }

        .form-message {
            min-height: 18px;

            margin-top: 14px;

            text-align: center;

            color: #ff5555;

            font-size: 12px;
        }

        .modal-note {
            margin-top: 17px;

            color: #5e5e66;

            font-size: 11px;

            line-height: 1.6;

            text-align: center;
        }

        /* =========================================
           FOOTER
        ========================================= */

        footer {
            border-top:
                1px solid rgba(255,255,255,0.05);

            padding: 25px 7%;

            display: flex;

            justify-content: space-between;
            align-items: center;

            color: #55555d;

            font-size: 12px;

            background:
                rgba(5,5,7,0.45);
        }

        footer a {
            color: #66666f;

            text-decoration: none;

            transition: 0.2s;
        }

        footer a:hover {
            color: #ffffff;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a:not(.dashboard-btn) {
                display: none;
            }

            .hero {
                min-height: 550px;

                padding:
                    80px 20px 70px;
            }

            .hero h1 {
                letter-spacing: -3px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            .glow {
                width: 400px;
                height: 400px;
            }

            .grid {
                opacity: 0.1;
            }

            .video-section {
                padding:
                    10px 15px 80px;
            }

            .video-container {
                width: 100%;
                border-radius: 9px;
            }

            footer {
                padding: 22px 20px;
            }
        }

        /* =========================================
           REDUCE MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <div class="glow"></div>

        <div class="top-glow"></div>

        <div class="grid"></div>

        <div class="side-light left"></div>

        <div class="side-light right"></div>

        <div
            class="particles"
            id="particles"
        ></div>

        <div class="vignette"></div>

    </div>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <nav>

        <a href="#" class="logo">
            Retired<span>.</span>Bet
        </a>

        <div class="nav-links">

            <a
                href="https://discord.gg/ntjkgHh43t"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord
            </a>

            <a
                href="#"
                class="dashboard-btn"
                onclick="openLogin(event)"
            >
                Dashboard
            </a>

        </div>

    </nav>


    <!-- =========================================
         HERO
    ========================================== -->

    <main class="hero">

        <h1>
            Retired<span>.</span>Bet
        </h1>

        <p class="hero-subtitle">
            The way to
            <span class="red-text">WIN</span>
        </p>

        <a
            href="https://discord.gg/ntjkgHh43t"
            target="_blank"
            rel="noopener noreferrer"
            class="discord-btn"
        >
            Join Discord
        </a>

    </main>


    <!-- =========================================
         YOUTUBE VIDEO
    ========================================== -->

    <section class="video-section">

        <div class="video-container">

            <iframe
                src="https://www.youtube.com/embed/wfZ50uQZwMQ"
                title="Retired.Bet Video"
                frameborder="0"
                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share
                "
                allowfullscreen>
            </iframe>

        </div>

    </section>


    <!-- =========================================
         LOGIN MODAL
    ========================================== -->

    <div
        class="modal-overlay"
        id="loginModal"
        onclick="closeOutside(event)"
    >

        <div
            class="modal"
            onclick="event.stopPropagation()"
        >

            <div class="modal-header">

                <h2>
                    Dashboard
                </h2>

                <button
                    class="close-btn"
                    onclick="closeLogin()"
                >
                    ×
                </button>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    class="form-input"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        id="password"
                        class="form-input"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- INVITE CODE -->

            <div class="form-group">

                <label for="inviteCode">
                    Invite Code
                </label>

                <input
                    id="inviteCode"
                    class="form-input"
                    type="text"
                    placeholder="Enter your invite code"
                    autocomplete="off"
                >

            </div>


            <!-- LOGIN -->

            <button
                class="login-btn"
                onclick="login()"
            >
                Login
            </button>


            <!-- REGISTER -->

            <button
                class="register-btn"
                onclick="register()"
            >
                Create Account
            </button>


            <div
                class="form-message"
                id="formMessage"
            ></div>


            <p class="modal-note">
                A valid invite code is required to create an
                account. Account authentication must be handled
                by a secure backend.
            </p>

        </div>

    </div>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <span>
            © 2026 Retired.Bet
        </span>

        <a
            href="https://discord.gg/2yzxkD874B"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        /* =========================================
           PARTICLES
        ========================================== */

        const particlesContainer =
            document.getElementById(
                "particles"
            );

        const particleCount = 70;

        for (
            let i = 0;
            i < particleCount;
            i++
        ) {

            const particle =
                document.createElement(
                    "div"
                );

            particle.className =
                "particle";

            const size =
                Math.random() * 2 + 1;

            const duration =
                Math.random() * 12 + 8;

            const fade =
                Math.random() * 4 + 3;

            const opacity =
                Math.random() * 0.55 + 0.15;

            const drift =
                (
                    Math.random() * 160 -
                    80
                ) + "px";

            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.bottom =
                Math.random() * -20 + "%";

            particle.style.setProperty(
                "--duration",
                duration + "s"
            );

            particle.style.setProperty(
                "--fade",
                fade + "s"
            );

            particle.style.setProperty(
                "--opacity",
                opacity
            );

            particle.style.setProperty(
                "--drift",
                drift
            );

            particle.style.animationDelay =
                -(Math.random() * duration) +
                "s";

            particlesContainer.appendChild(
                particle
            );
        }


        /* =========================================
           LOGIN MODAL
        ========================================== */

        const modal =
            document.getElementById(
                "loginModal"
            );

        const message =
            document.getElementById(
                "formMessage"
            );


        function openLogin(event) {

            if (event) {
                event.preventDefault();
            }

            modal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

            setTimeout(() => {

                document
                    .getElementById(
                        "username"
                    )
                    .focus();

            }, 100);
        }


        function closeLogin() {

            modal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

            message.textContent = "";
        }


        function closeOutside(event) {

            if (
                event.target === modal
            ) {
                closeLogin();
            }
        }


        /* =========================================
           PASSWORD VISIBILITY
        ========================================== */

        function togglePassword() {

            const password =
                document.getElementById(
                    "password"
                );

            const button =
                document.querySelector(
                    ".password-toggle"
                );


            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                button.textContent =
                    "Hide";

            } else {

                password.type =
                    "password";

                button.textContent =
                    "Show";
            }
        }


        /* =========================================
           LOGIN
        ========================================== */

        function login() {

            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;

            const inviteCode =
                document
                    .getElementById(
                        "inviteCode"
                    )
                    .value
                    .trim();


            if (
                !username ||
                !password ||
                !inviteCode
            ) {

                message.textContent =
                    "Please fill in all fields.";

                return;
            }


            message.textContent =
                "Login requires a connected backend.";
        }


        /* =========================================
           REGISTER
        ========================================== */

        function register() {

            const inviteCode =
                document
                    .getElementById(
                        "inviteCode"
                    )
                    .value
                    .trim();


            if (!inviteCode) {

                message.textContent =
                    "A valid invite code is required.";

                return;
            }


            message.textContent =
                "Registration requires a secure backend and valid invite code.";
        }


        /* =========================================
           ESCAPE KEY
        ========================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {
                    closeLogin();
                }

            }
        );

    </script>

</body>
</html>
