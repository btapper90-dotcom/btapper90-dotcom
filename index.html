<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retired.Bet — The Way to WIN</title>
    <meta name="description" content="Retired.Bet — The way to WIN.">

    <style>
        :root {
            --red: #ff1515;
            --red-bright: #ff3333;
            --red-dark: #b80000;
            --bg: #030304;
            --bg-2: #070709;
            --panel: rgba(14, 14, 17, 0.72);
            --panel-solid: #0d0d10;
            --text: #f7f7f8;
            --muted: #77777f;
            --muted-2: #505057;
            --border: rgba(255,255,255,0.07);
            --red-border: rgba(255,21,21,0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, textarea { font: inherit; }
        a { color: inherit; }

        .site-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -20;
            background:
                radial-gradient(circle at 50% 5%, rgba(255,21,21,.075), transparent 30%),
                radial-gradient(circle at 15% 65%, rgba(255,21,21,.025), transparent 25%),
                #030304;
        }

        .noise {
            position: absolute;
            inset: 0;
            opacity: .035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        }

        .ambient {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
        }

        .ambient.one {
            width: 520px;
            height: 520px;
            left: 50%;
            top: -300px;
            transform: translateX(-50%);
            background: rgba(255,21,21,.16);
        }

        .ambient.two {
            width: 280px;
            height: 650px;
            left: -230px;
            top: 30%;
            background: rgba(255,21,21,.07);
        }

        .ambient.three {
            width: 280px;
            height: 650px;
            right: -230px;
            top: 45%;
            background: rgba(255,21,21,.055);
        }

        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,21,21,.7), transparent);
            box-shadow: 0 0 25px rgba(255,21,21,.7);
        }

        .perspective-grid {
            position: absolute;
            width: 180%;
            height: 75%;
            left: -40%;
            bottom: -34%;
            opacity: .1;
            background-image:
                linear-gradient(rgba(255,21,21,.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,21,21,.18) 1px, transparent 1px);
            background-size: 65px 65px;
            transform: perspective(500px) rotateX(62deg);
            animation: gridMove 9s linear infinite;
        }

        @keyframes gridMove {
            from { transform: perspective(500px) rotateX(62deg) translateY(0); }
            to { transform: perspective(500px) rotateX(62deg) translateY(65px); }
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 1px;
            top: -10%;
            left: 0;
            opacity: 0;
            background: linear-gradient(90deg, transparent, rgba(255,21,21,.25), transparent);
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10%, 90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        #particles { position: absolute; inset: 0; }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #ff1515;
            box-shadow: 0 0 10px rgba(255,21,21,.8);
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            from { transform: translate3d(0,110vh,0); opacity: 0; }
            12%, 85% { opacity: .55; }
            to { transform: translate3d(0,-15vh,0); opacity: 0; }
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.7) 100%);
        }

        .navbar-wrap {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1180px, calc(100% - 32px));
            z-index: 50;
        }

        nav {
            height: 68px;
            padding: 0 10px 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,.075);
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(18,18,21,.88), rgba(7,7,9,.76));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 20px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
        }

        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 850;
            letter-spacing: -.7px;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3535, #a90000);
            box-shadow: 0 0 22px rgba(255,21,21,.25);
        }

        .logo span { color: var(--red); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-link {
            text-decoration: none;
            color: #929299;
            padding: 10px 13px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 650;
            transition: .2s ease;
        }

        .nav-link:hover {
            color: white;
            background: rgba(255,255,255,.04);
        }

        .buy-button {
            text-decoration: none;
            color: #ff4b4b;
            border: 1px solid rgba(255,21,21,.22);
            background: rgba(255,21,21,.055);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            transition: .2s ease;
        }

        .buy-button:hover {
            color: white;
            border-color: rgba(255,21,21,.55);
            background: rgba(255,21,21,.12);
            box-shadow: 0 0 25px rgba(255,21,21,.1);
            transform: translateY(-1px);
        }

        .dashboard-button {
            text-decoration: none;
            margin-left: 4px;
            padding: 11px 16px;
            border-radius: 9px;
            color: white;
            font-size: 13px;
            font-weight: 750;
            border: 1px solid #ff1515;
            background: linear-gradient(135deg, #ff2828, #d70707);
            box-shadow: 0 5px 20px rgba(255,21,21,.14);
            transition: .2s ease;
        }

        .dashboard-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255,21,21,.25);
        }

        /* The rest of the page keeps the original Retired.Bet styling. */
    </style>
</head>
<body>
    <div class="site-background">
        <div class="top-line"></div>
        <div class="ambient one"></div>
        <div class="ambient two"></div>
        <div class="ambient three"></div>
        <div class="perspective-grid"></div>
        <div class="scanline"></div>
        <div id="particles"></div>
        <div class="noise"></div>
        <div class="vignette"></div>
    </div>

    <div class="navbar-wrap">
        <nav>
            <a href="#" class="logo">
                <div class="logo-mark">R</div>
                <span>Retired<span>.</span>Bet</span>
            </a>

            <div class="nav-links">
                <a class="nav-link"
                   href="https://discord.gg/2yzxkD874B"
                   target="_blank"
                   rel="noopener noreferrer">Discord</a>

                <a class="buy-button"
                   href="#"
                   onclick="openProductSelector(event)">Purchase Subscription</a>

                <a href="#"
                   class="dashboard-button"
                   onclick="openLogin(event)">Dashboard</a>
            </div>
        </nav>
    </div>

    <!-- Keep the remaining original page sections, dashboard modal,
         registration flow, video sections, and reviews here. -->

    <script>
        const CS2_MONTHLY_URL =
            "https://buy.stripe.com/00w3cn9ps0xw8nh4OM8EM01";

        const CS2_THREE_MONTH_URL =
            "https://buy.stripe.com/14A9ALatw942gTNgxu8EM03";

        const ROBLOX_URL =
            "https://buy.stripe.com/28E3cngRU0xw7jd2GE8EM02";

        function openProductSelector(event) {
            if (event) event.preventDefault();

            const overlay = document.getElementById("productSelector");
            if (!overlay) return;

            overlay.classList.add("active");
            document.body.style.overflow = "hidden";

            showProductOptions();
        }

        function closeProductSelector(event) {
            if (event && event.target !== event.currentTarget) return;

            const overlay = document.getElementById("productSelector");
            if (!overlay) return;

            overlay.classList.remove("active");
            document.body.style.overflow = "";
        }

        function showProductOptions() {
            const content = document.getElementById("productSelectorContent");
            if (!content) return;

            content.innerHTML = `
                <div class="product-modal-header">
                    <div class="product-kicker">RETIRED.BET</div>
                    <h2>Purchase Subscription</h2>
                    <p>Select the product you want to purchase.</p>
                </div>

                <div class="product-options">
                    <button class="product-option" onclick="showCS2Plans()">
                        <span class="product-option-icon">CS2</span>
                        <span class="product-option-title">Counter-Strike 2</span>
                        <span class="product-option-description">Choose a subscription duration</span>
                        <span class="product-option-arrow">→</span>
                    </button>

                    <button class="product-option" onclick="purchaseRoblox()">
                        <span class="product-option-icon">R</span>
                        <span class="product-option-title">Roblox</span>
                        <span class="product-option-description">Continue to Roblox checkout</span>
                        <span class="product-option-arrow">→</span>
                    </button>
                </div>
            `;
        }

        function showCS2Plans() {
            const content = document.getElementById("productSelectorContent");
            if (!content) return;

            content.innerHTML = `
                <div class="product-modal-header">
                    <div class="product-kicker">COUNTER-STRIKE 2</div>
                    <h2>Choose your subscription</h2>
                    <p>Select a plan to continue to secure checkout.</p>
                </div>

                <div class="product-options">
                    <button class="product-option" onclick="purchaseCS2Monthly()">
                        <span class="product-option-title">1 Month</span>
                        <span class="product-price">$14.99</span>
                        <span class="product-option-description">One-month subscription</span>
                        <span class="product-option-arrow">→</span>
                    </button>

                    <button class="product-option" onclick="purchaseCS2ThreeMonths()">
                        <span class="product-option-title">3 Months</span>
                        <span class="product-price">$24.99</span>
                        <span class="product-option-description">Three-month subscription</span>
                        <span class="product-option-arrow">→</span>
                    </button>
                </div>

                <button class="product-back-button" onclick="showProductOptions()">
                    ← Back to products
                </button>
            `;
        }

        function purchaseCS2Monthly() {
            window.location.href = CS2_MONTHLY_URL;
        }

        function purchaseCS2ThreeMonths() {
            window.location.href = CS2_THREE_MONTH_URL;
        }

        function purchaseRoblox() {
            window.location.href = ROBLOX_URL;
        }
    </script>
</body>
</html>
